name: Deploy Ubuntu Server

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - production
      run_migrations:
        description: Run php84 artisan migrate --force after migrate:status
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy dev domain
    if: ${{ (github.event_name == 'push' && github.ref_name == 'dev') || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev') }}
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: swinx-deploy-dev
      cancel-in-progress: false
    steps:
      - name: Deploy dev over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -Eeuo pipefail

            TARGET_PATH="/www/wwwroot/dev-x.asia-vn.edu.vn/asia-admin-portal"
            DEPLOY_BRANCH="dev"
            DEPLOY_SHA="${{ github.event_name == 'push' && github.sha || '' }}"
            RUN_MIGRATIONS="${{ github.event_name == 'workflow_dispatch' && inputs.run_migrations || 'true' }}"

            echo "Deploying dev branch to ${TARGET_PATH}"
            cd "${TARGET_PATH}"

            if [ ! -d .git ]; then
              echo "Target path is not a git worktree: ${TARGET_PATH}" >&2
              exit 10
            fi

            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "Tracked server-side changes exist in ${TARGET_PATH}; aborting to avoid overwriting manual edits." >&2
              git status --short --untracked-files=no
              exit 11
            fi

            git fetch origin "${DEPLOY_BRANCH}" --prune
            git checkout -B "${DEPLOY_BRANCH}" "origin/${DEPLOY_BRANCH}"

            if [ -n "${DEPLOY_SHA}" ]; then
              git cat-file -e "${DEPLOY_SHA}^{commit}"
              git reset --hard "${DEPLOY_SHA}"
            else
              git reset --hard "origin/${DEPLOY_BRANCH}"
            fi

            DEPLOY_ENVIRONMENT="development" \
            DEPLOY_RUN_MIGRATIONS="${RUN_MIGRATIONS}" \
            bash scripts/deploy-ubuntu.sh

      - name: Dev health check
        run: curl -fsS --retry 3 --retry-delay 5 https://dev-x.asia-vn.edu.vn/up

  deploy-production:
    name: Deploy production domains
    if: ${{ (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production') }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: swinx-deploy-production
      cancel-in-progress: false
    strategy:
      max-parallel: 1
      matrix:
        include:
          - name: metropolia
            domain: x.metropolia.edu.vn
            path: /www/wwwroot/x.metropolia.edu.vn/asia-admin-portal
          - name: asia-vn
            domain: x.asia-vn.edu.vn
            path: /www/wwwroot/x.asia-vn.edu.vn/public_html
    steps:
      - name: Deploy ${{ matrix.name }} over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -Eeuo pipefail

            TARGET_PATH="${{ matrix.path }}"
            DEPLOY_BRANCH="main"
            DEPLOY_SHA="${{ github.event_name == 'push' && github.sha || '' }}"
            RUN_MIGRATIONS="${{ github.event_name == 'workflow_dispatch' && inputs.run_migrations || 'false' }}"

            echo "Deploying main branch to ${TARGET_PATH}"
            cd "${TARGET_PATH}"

            if [ ! -d .git ]; then
              echo "Target path is not a git worktree: ${TARGET_PATH}" >&2
              exit 10
            fi

            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "Tracked server-side changes exist in ${TARGET_PATH}; aborting to avoid overwriting manual edits." >&2
              git status --short --untracked-files=no
              exit 11
            fi

            git fetch origin "${DEPLOY_BRANCH}" --prune
            git checkout -B "${DEPLOY_BRANCH}" "origin/${DEPLOY_BRANCH}"

            if [ -n "${DEPLOY_SHA}" ]; then
              git cat-file -e "${DEPLOY_SHA}^{commit}"
              git reset --hard "${DEPLOY_SHA}"
            else
              git reset --hard "origin/${DEPLOY_BRANCH}"
            fi

            DEPLOY_ENVIRONMENT="production" \
            DEPLOY_RUN_MIGRATIONS="${RUN_MIGRATIONS}" \
            bash scripts/deploy-ubuntu.sh

      - name: Health check ${{ matrix.name }}
        run: curl -fsS --retry 3 --retry-delay 5 https://${{ matrix.domain }}/up
