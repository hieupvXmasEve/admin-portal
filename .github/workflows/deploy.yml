name: Deploy Ubuntu Server

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - production
      run_migrations:
        description: Run php84 artisan migrate --force after migrate:status
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy dev domain
    if: ${{ (github.event_name == 'push' && github.ref_name == 'dev') || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev') }}
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: swinx-deploy-dev
      cancel-in-progress: false
    steps:
      - name: Connect to prod VPN
        env:
          OVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
          VPN_HOST: ${{ secrets.DEPLOY_HOST_VPN || '10.8.0.1' }}
          VPN_PORT: 22
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn >/dev/null
          umask 077
          printf '%s\n' "$OVPN_CONFIG" | sudo tee /etc/openvpn/deploy.conf >/dev/null
          # --ping/--ping-restart keep the tunnel's NAT flow alive during
          # long, near-idle server-side steps (git fetch, docker pull/build),
          # which otherwise let the SSH session get torn down mid-deploy.
          sudo openvpn --config /etc/openvpn/deploy.conf --daemon \
            --ping 10 --ping-restart 120 --persist-tun --persist-key \
            --log /var/log/openvpn-deploy.log --writepid /run/openvpn-deploy.pid
          echo "Waiting for VPN tunnel and reachability to ${VPN_HOST}:${VPN_PORT}..."
          for i in $(seq 1 30); do
            if ip -o link show up | grep -qE ': (tun|tap)[0-9]' \
               && timeout 3 bash -c "cat < /dev/null > /dev/tcp/${VPN_HOST}/${VPN_PORT}" 2>/dev/null; then
              echo "VPN up; ${VPN_HOST}:${VPN_PORT} reachable"
              exit 0
            fi
            sleep 2
          done
          echo "VPN did not come up or host unreachable" >&2
          sudo cat /var/log/openvpn-deploy.log || true
          exit 1
      - name: Deploy dev over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST_VPN || '10.8.0.1' }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -Eeuo pipefail

            TARGET_PATH="/www/wwwroot/dev-x.asia-vn.edu.vn/asia-admin-portal"
            DEPLOY_BRANCH="dev"
            DEPLOY_SHA="${{ github.event_name == 'push' && github.sha || '' }}"
            RUN_MIGRATIONS="${{ github.event_name == 'workflow_dispatch' && inputs.run_migrations || 'true' }}"

            echo "Deploying dev branch to ${TARGET_PATH}"
            cd "${TARGET_PATH}"

            if [ ! -d .git ]; then
              echo "Target path is not a git worktree: ${TARGET_PATH}" >&2
              exit 10
            fi

            tracked_changes="$(git status --porcelain --untracked-files=no | sed '/^[ MTADRCU?!][ MTADRCU?!] resources\/js\/ziggy\.js$/d')"
            if [ -n "${tracked_changes}" ]; then
              echo "Tracked server-side changes exist in ${TARGET_PATH}; aborting to avoid overwriting manual edits." >&2
              printf '%s\n' "${tracked_changes}"
              exit 11
            fi

            # github.com:22 intermittently times out from these servers.
            # Retry, then fall back to GitHub's SSH endpoint on port 443.
            fetch_branch() {
              git fetch origin "${DEPLOY_BRANCH}" --prune && return 0
              echo "git fetch over port 22 failed; retrying via ssh.github.com:443" >&2
              for attempt in 1 2 3; do
                GIT_SSH_COMMAND='ssh -o HostName=ssh.github.com -o Port=443' \
                  git fetch origin "${DEPLOY_BRANCH}" --prune && return 0
                sleep 10
              done
              echo "git fetch failed after fallback retries" >&2
              return 1
            }
            fetch_branch
            git checkout -B "${DEPLOY_BRANCH}" "origin/${DEPLOY_BRANCH}"

            if [ -n "${DEPLOY_SHA}" ]; then
              git cat-file -e "${DEPLOY_SHA}^{commit}"
              git reset --hard "${DEPLOY_SHA}"
            else
              git reset --hard "origin/${DEPLOY_BRANCH}"
            fi

            DEPLOY_ENVIRONMENT="development" \
            DEPLOY_RUN_MIGRATIONS="${RUN_MIGRATIONS}" \
            bash scripts/deploy-ubuntu.sh

  deploy-production:
    name: Deploy production domains
    if: ${{ (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production') }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: swinx-deploy-production
      cancel-in-progress: false
    strategy:
      max-parallel: 1
      matrix:
        include:
          - name: metropolia
            domain: x.metropolia.edu.vn
            path: /www/wwwroot/x.metropolia.edu.vn/asia-admin-portal
          - name: asia-vn
            domain: x.asia-vn.edu.vn
            path: /www/wwwroot/x.asia-vn.edu.vn/public_html
    steps:
      - name: Connect to prod VPN
        env:
          OVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
          VPN_HOST: ${{ secrets.DEPLOY_HOST_VPN || '10.8.0.1' }}
          VPN_PORT: 22
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn >/dev/null
          umask 077
          printf '%s\n' "$OVPN_CONFIG" | sudo tee /etc/openvpn/deploy.conf >/dev/null
          # --ping/--ping-restart keep the tunnel's NAT flow alive during
          # long, near-idle server-side steps (git fetch, docker pull/build),
          # which otherwise let the SSH session get torn down mid-deploy.
          sudo openvpn --config /etc/openvpn/deploy.conf --daemon \
            --ping 10 --ping-restart 120 --persist-tun --persist-key \
            --log /var/log/openvpn-deploy.log --writepid /run/openvpn-deploy.pid
          echo "Waiting for VPN tunnel and reachability to ${VPN_HOST}:${VPN_PORT}..."
          for i in $(seq 1 30); do
            if ip -o link show up | grep -qE ': (tun|tap)[0-9]' \
               && timeout 3 bash -c "cat < /dev/null > /dev/tcp/${VPN_HOST}/${VPN_PORT}" 2>/dev/null; then
              echo "VPN up; ${VPN_HOST}:${VPN_PORT} reachable"
              exit 0
            fi
            sleep 2
          done
          echo "VPN did not come up or host unreachable" >&2
          sudo cat /var/log/openvpn-deploy.log || true
          exit 1
      - name: Deploy ${{ matrix.name }} over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST_VPN || '10.8.0.1' }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -Eeuo pipefail

            TARGET_PATH="${{ matrix.path }}"
            DEPLOY_BRANCH="main"
            DEPLOY_SHA="${{ github.event_name == 'push' && github.sha || '' }}"
            RUN_MIGRATIONS="${{ github.event_name == 'workflow_dispatch' && inputs.run_migrations || 'true' }}"

            echo "Deploying main branch to ${TARGET_PATH}"
            cd "${TARGET_PATH}"

            if [ ! -d .git ]; then
              echo "Target path is not a git worktree: ${TARGET_PATH}" >&2
              exit 10
            fi

            tracked_changes="$(git status --porcelain --untracked-files=no | sed '/^[ MTADRCU?!][ MTADRCU?!] resources\/js\/ziggy\.js$/d')"
            if [ -n "${tracked_changes}" ]; then
              echo "Tracked server-side changes exist in ${TARGET_PATH}; aborting to avoid overwriting manual edits." >&2
              printf '%s\n' "${tracked_changes}"
              exit 11
            fi

            # github.com:22 intermittently times out from these servers.
            # Retry, then fall back to GitHub's SSH endpoint on port 443.
            fetch_branch() {
              git fetch origin "${DEPLOY_BRANCH}" --prune && return 0
              echo "git fetch over port 22 failed; retrying via ssh.github.com:443" >&2
              for attempt in 1 2 3; do
                GIT_SSH_COMMAND='ssh -o HostName=ssh.github.com -o Port=443' \
                  git fetch origin "${DEPLOY_BRANCH}" --prune && return 0
                sleep 10
              done
              echo "git fetch failed after fallback retries" >&2
              return 1
            }
            fetch_branch
            git checkout -B "${DEPLOY_BRANCH}" "origin/${DEPLOY_BRANCH}"

            if [ -n "${DEPLOY_SHA}" ]; then
              git cat-file -e "${DEPLOY_SHA}^{commit}"
              git reset --hard "${DEPLOY_SHA}"
            else
              git reset --hard "origin/${DEPLOY_BRANCH}"
            fi

            DEPLOY_ENVIRONMENT="production" \
            DEPLOY_RUN_MIGRATIONS="${RUN_MIGRATIONS}" \
            bash scripts/deploy-ubuntu.sh

  deploy-docker:
    name: Deploy ${{ matrix.name }} (Docker)
    if: ${{ (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production') }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: swinx-deploy-${{ matrix.name }}-docker
      cancel-in-progress: false
    strategy:
      max-parallel: 1
      matrix:
        include:
          - name: knu
            domain: x.knu.edu.vn
            path: /www/wwwroot/x.knu.edu.vn/asia-admin-portal
            project: school-knu
          - name: gachon
            domain: x.gachon.edu.vn
            path: /www/wwwroot/x.gachon.edu.vn/asia-admin-portal
            project: school-gachon
          - name: jinan
            domain: x.jinan.edu.vn
            path: /www/wwwroot/x.jinan.edu.vn/asia-admin-portal
            project: school-jinan
    steps:
      - name: Connect to prod VPN
        env:
          OVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
          VPN_HOST: ${{ secrets.DEPLOY_HOST_VPN || '10.8.0.1' }}
          VPN_PORT: 22
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn >/dev/null
          umask 077
          printf '%s\n' "$OVPN_CONFIG" | sudo tee /etc/openvpn/deploy.conf >/dev/null
          # --ping/--ping-restart keep the tunnel's NAT flow alive during
          # long, near-idle server-side steps (git fetch, docker pull/build),
          # which otherwise let the SSH session get torn down mid-deploy.
          sudo openvpn --config /etc/openvpn/deploy.conf --daemon \
            --ping 10 --ping-restart 120 --persist-tun --persist-key \
            --log /var/log/openvpn-deploy.log --writepid /run/openvpn-deploy.pid
          echo "Waiting for VPN tunnel and reachability to ${VPN_HOST}:${VPN_PORT}..."
          for i in $(seq 1 30); do
            if ip -o link show up | grep -qE ': (tun|tap)[0-9]' \
               && timeout 3 bash -c "cat < /dev/null > /dev/tcp/${VPN_HOST}/${VPN_PORT}" 2>/dev/null; then
              echo "VPN up; ${VPN_HOST}:${VPN_PORT} reachable"
              exit 0
            fi
            sleep 2
          done
          echo "VPN did not come up or host unreachable" >&2
          sudo cat /var/log/openvpn-deploy.log || true
          exit 1
      - name: Deploy ${{ matrix.name }} over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST_VPN || '10.8.0.1' }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -Eeuo pipefail

            TARGET_PATH="${{ matrix.path }}"
            DEPLOY_BRANCH="main"
            DEPLOY_SHA="${{ github.event_name == 'push' && github.sha || '' }}"
            RUN_MIGRATIONS="${{ github.event_name == 'workflow_dispatch' && inputs.run_migrations || 'true' }}"
            PROJECT_NAME="${{ matrix.project }}"
            COMPOSE_FILE="docker/docker-compose.production.yml"

            echo "Deploying main branch to ${TARGET_PATH} (docker)"
            cd "${TARGET_PATH}"

            if [ ! -d .git ]; then
              echo "Target path is not a git worktree: ${TARGET_PATH}" >&2
              exit 10
            fi

            tracked_changes="$(git status --porcelain --untracked-files=no)"
            if [ -n "${tracked_changes}" ]; then
              echo "Tracked server-side changes exist in ${TARGET_PATH}; aborting to avoid overwriting manual edits." >&2
              printf '%s\n' "${tracked_changes}"
              exit 11
            fi

            # github.com:22 intermittently times out from these servers.
            # Retry, then fall back to GitHub's SSH endpoint on port 443.
            fetch_branch() {
              git fetch origin "${DEPLOY_BRANCH}" --prune && return 0
              echo "git fetch over port 22 failed; retrying via ssh.github.com:443" >&2
              for attempt in 1 2 3; do
                GIT_SSH_COMMAND='ssh -o HostName=ssh.github.com -o Port=443' \
                  git fetch origin "${DEPLOY_BRANCH}" --prune && return 0
                sleep 10
              done
              echo "git fetch failed after fallback retries" >&2
              return 1
            }
            fetch_branch
            git checkout -B "${DEPLOY_BRANCH}" "origin/${DEPLOY_BRANCH}"

            if [ -n "${DEPLOY_SHA}" ]; then
              git cat-file -e "${DEPLOY_SHA}^{commit}"
              git reset --hard "${DEPLOY_SHA}"
            else
              git reset --hard "origin/${DEPLOY_BRANCH}"
            fi

            dc() {
              docker compose --env-file .env -f "${COMPOSE_FILE}" -p "${PROJECT_NAME}" "$@"
            }

            dc build app queue scheduler

            # cache_data is a named volume that outlives image rebuilds; a
            # stale bootstrap/cache/config.php from an older commit can
            # reference classes removed since. Laravel's config bootstrapper
            # loads that cache file (and re-registers its provider list)
            # before ANY artisan command runs — so `artisan optimize:clear`
            # itself would crash the same way. Delete the cache files
            # directly instead, bypassing Laravel bootstrap entirely.
            dc run --rm --entrypoint sh app -c 'rm -f bootstrap/cache/*.php' || true

            if [ "${RUN_MIGRATIONS}" = "true" ]; then
              dc run --rm app php artisan migrate --force
            fi

            dc run --rm app php artisan db:seed --class=UpdatePermissionsSeeder --force

            dc run --rm app php artisan academic:backfill-program-enrollments
            dc run --rm app php artisan academic:backfill-program-enrollments --check

            dc up -d --force-recreate app queue scheduler
