services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.production
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Asia University}
        VITE_APP_URL_FE: ${VITE_APP_URL_FE:-http://localhost:3000}
        VITE_APP_URL_FE_LECTURE: ${VITE_APP_URL_FE_LECTURE:-http://localhost:3001}
        VITE_BROADCASTER: ${VITE_BROADCASTER:-}
        VITE_BROADCAST_KEY: ${VITE_BROADCAST_KEY:-}
        VITE_PUSH_CLUSTER: ${VITE_PUSH_CLUSTER:-mt1}
        VITE_SOCKET_HOST: ${VITE_SOCKET_HOST:-}
        VITE_SOCKET_PORT: ${VITE_SOCKET_PORT:-443}
    env_file:
      - ../.env
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTP3_PORT:-443}:443/udp'
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - storage_data:/app/storage
      - cache_data:/app/bootstrap/cache
      - caddy_data:/data
      - caddy_config:/config
      - ../logs:/var/log/caddy
      - ./Caddyfile.proxy:/etc/caddy/Caddyfile:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  queue:
    build:
      context: ..
      dockerfile: docker/Dockerfile.production
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Asia University}
        VITE_APP_URL_FE: ${VITE_APP_URL_FE:-http://localhost:3000}
        VITE_APP_URL_FE_LECTURE: ${VITE_APP_URL_FE_LECTURE:-http://localhost:3001}
        VITE_BROADCASTER: ${VITE_BROADCASTER:-}
        VITE_BROADCAST_KEY: ${VITE_BROADCAST_KEY:-}
        VITE_PUSH_CLUSTER: ${VITE_PUSH_CLUSTER:-mt1}
        VITE_SOCKET_HOST: ${VITE_SOCKET_HOST:-}
        VITE_SOCKET_PORT: ${VITE_SOCKET_PORT:-443}
    env_file:
      - ../.env
    working_dir: /app
    command: php artisan queue:work --queue=${QUEUE_WORKER_QUEUES:-default,emails,bulk-emails,notifications,finance,webhooks,reconciliation} --sleep=${QUEUE_WORKER_SLEEP:-1} --tries=${QUEUE_WORKER_TRIES:-3} --verbose
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - storage_data:/app/storage
      - cache_data:/app/bootstrap/cache
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      disable: true
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile.production
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Asia University}
        VITE_APP_URL_FE: ${VITE_APP_URL_FE:-http://localhost:3000}
        VITE_APP_URL_FE_LECTURE: ${VITE_APP_URL_FE_LECTURE:-http://localhost:3001}
        VITE_BROADCASTER: ${VITE_BROADCASTER:-}
        VITE_BROADCAST_KEY: ${VITE_BROADCAST_KEY:-}
        VITE_PUSH_CLUSTER: ${VITE_PUSH_CLUSTER:-mt1}
        VITE_SOCKET_HOST: ${VITE_SOCKET_HOST:-}
        VITE_SOCKET_PORT: ${VITE_SOCKET_PORT:-443}
    env_file:
      - ../.env
    working_dir: /app
    command: php artisan schedule:work
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - storage_data:/app/storage
      - cache_data:/app/bootstrap/cache
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      disable: true
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MARIADB_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data_host:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ../backups:/backups
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mariadb-admin ping -h localhost -uroot -p"$$MARIADB_ROOT_PASSWORD" --silent',
        ]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s
    restart: unless-stopped

volumes:
  storage_data:
  cache_data:
  db_data_host:
  redis_data:
  caddy_data:
  caddy_config:
