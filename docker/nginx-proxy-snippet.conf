# aaPanel / nginx reverse-proxy snippet for Swinx host Docker mode.
# Replace 8080 with HOST_APP_PORT from .env if different.
#
# In aaPanel: Website → your domain → Config → add inside the server { } block,
# or replace the existing PHP location with this proxy block.

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
}