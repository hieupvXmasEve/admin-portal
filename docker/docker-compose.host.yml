# Host deployment: one exposed port, everything else internal.
# Point Cloudflare or aaPanel nginx at HOST_APP_PORT (default 8080).
# Uses Caddyfile.proxy (HTTP inside container; TLS at the edge).

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.production
    container_name: swinx-app-host
    env_file:
      - ../.env
    ports:
      - '${HOST_APP_PORT:-8080}:80'
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - storage_data_host:/app/storage
      - cache_data_host:/app/bootstrap/cache
      - ./Caddyfile.proxy:/etc/caddy/Caddyfile:ro
      - ../logs:/var/log/caddy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost/up']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  queue:
    build:
      context: ..
      dockerfile: docker/Dockerfile.production
    container_name: swinx-queue-host
    env_file:
      - ../.env
    working_dir: /app
    command: php artisan queue:work --queue=${QUEUE_WORKER_QUEUES:-default,emails,bulk-emails,notifications,finance,webhooks,reconciliation} --sleep=${QUEUE_WORKER_SLEEP:-1} --tries=${QUEUE_WORKER_TRIES:-3} --verbose
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - storage_data_host:/app/storage
      - cache_data_host:/app/bootstrap/cache
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile.production
    container_name: swinx-scheduler-host
    env_file:
      - ../.env
    working_dir: /app
    command: php artisan schedule:work
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - storage_data_host:/app/storage
      - cache_data_host:/app/bootstrap/cache
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: swinx-redis-host
    command: redis-server --appendonly yes
    volumes:
      - redis_data_host:/data
    restart: unless-stopped

  db:
    image: mariadb:11.4
    container_name: swinx-db-host
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MARIADB_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data_host:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ../backups:/backups
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mariadb-admin ping -h localhost -uroot -p"$$MARIADB_ROOT_PASSWORD" --silent',
        ]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s
    restart: unless-stopped

volumes:
  storage_data_host:
  cache_data_host:
  db_data_host:
  redis_data_host:
