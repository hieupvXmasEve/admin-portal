services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.production
    container_name: swinx-app-local-prod
    env_file:
      - ../.env
    ports:
      - '${LOCAL_PROD_HTTP_PORT:-8080}:80'
      - '${LOCAL_PROD_HTTPS_PORT:-8443}:443'
      - '${LOCAL_PROD_HTTP3_PORT:-8443}:443/udp'
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      SERVER_NAME: ${LOCAL_PROD_SERVER_NAME:-swinx.test}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - ../:/app
      - composer_vendor_local_prod:/app/vendor
      - node_modules_local_prod:/app/node_modules
      - caddy_data_local_prod:/data
      - caddy_config_local_prod:/config
      - ../logs:/var/log/caddy
      - ./Caddyfile.local-prod:/etc/caddy/Caddyfile:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  queue:
    build:
      context: ..
      dockerfile: docker/Dockerfile.production
    container_name: swinx-queue-local-prod
    env_file:
      - ../.env
    working_dir: /app
    command: php artisan queue:work --queue=${QUEUE_WORKER_QUEUES:-default,emails,bulk-emails,notifications,finance,webhooks,reconciliation} --sleep=${QUEUE_WORKER_SLEEP:-1} --tries=${QUEUE_WORKER_TRIES:-3} --verbose
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - ../:/app
      - composer_vendor_local_prod:/app/vendor
      - node_modules_local_prod:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile.production
    container_name: swinx-scheduler-local-prod
    env_file:
      - ../.env
    working_dir: /app
    command: php artisan schedule:work
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - ../:/app
      - composer_vendor_local_prod:/app/vendor
      - node_modules_local_prod:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: swinx-redis-local-prod
    command: redis-server --appendonly yes
    volumes:
      - redis_data_local_prod:/data
    restart: unless-stopped

  db:
    image: mariadb:11.4
    container_name: swinx-db-local-prod
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_DATABASE:-asia}
      MARIADB_USER: ${DB_USERNAME:-swinx}
      MARIADB_PASSWORD: ${DB_PASSWORD:-swinx}
    volumes:
      - db_data_local_prod:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ../backups:/backups
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mariadb-admin ping -h localhost -uroot -p"$$MARIADB_ROOT_PASSWORD" --silent',
        ]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s
    restart: unless-stopped

volumes:
  composer_vendor_local_prod:
  node_modules_local_prod:
  caddy_data_local_prod:
  caddy_config_local_prod:
  redis_data_local_prod:
  db_data_local_prod:
