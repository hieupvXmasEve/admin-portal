services:
    db:
        build:
            context: ./docker/mysql
        container_name: swinx-db
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: admin
            MYSQL_DATABASE: swinburne
        volumes:
            - mysql_data:/var/lib/mysql
        restart: always

volumes:
    mysql_data:
